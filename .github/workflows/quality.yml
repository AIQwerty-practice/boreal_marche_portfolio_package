name: Quality and assistant evaluation

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Prepare synthetic tool fixtures (not model-performance evidence)
        run: python scripts/prepare_ci_fixtures.py

      - name: Lint
        run: ruff check .

      - name: Run unit, golden-set, and adversarial tests with coverage gate
        run: >-
          pytest --cov=src/boreal_marche --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=60

      - name: Execute frozen assistant evaluation
        run: python scripts/evaluate_assistant.py --root .

      - name: Upload assistant evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: assistant-evaluation
          path: |
            reports/d3/assistant_evaluation.csv
            reports/d3/assistant_evaluation.json
            reports/d3/figures/assistant_golden_evaluation.png
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
