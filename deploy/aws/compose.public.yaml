services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BOREAL_DOMAIN: ${BOREAL_DOMAIN:?Set BOREAL_DOMAIN in deploy/aws/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - boreal_private
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
