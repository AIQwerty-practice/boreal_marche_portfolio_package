[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "boreal-marche"
version = "0.1.0"
description = "Boreal Marche customer intelligence capstone project"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anyio>=4,<4.15",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "mlflow>=3,<4",
  "mlxtend>=0.23,<1",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "optuna>=4,<5",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic>=2,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
competition = [
  "xgboost>=2,<4",
  "catboost>=1.2,<2",
  "lightgbm>=4,<5",
]
dev = [
  "ipykernel>=7,<8",
  "nbclient>=0.11,<1",
  "nbformat>=5.11,<6",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boreal_marche"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
